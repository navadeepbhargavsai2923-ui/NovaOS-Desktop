name: Build NovaOS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build environment
        run: |
          uname -m
          cat /etc/os-release

      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso squashfs-tools debootstrap \
            grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools

      - name: Validate project configuration
        run: |
          test -f README.md
          test -f config/novaos.conf
          test -f docs/BUILD.md
          echo "NovaOS project files validated."
